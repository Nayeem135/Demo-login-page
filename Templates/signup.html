<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account · RoutOS</title>
    <link rel="icon" href="/static/images/logo (2) (1).png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="signup-page">

    <div class="signup-card">
        <a href="/" class="brand">
            <img src="/static/images/logo (2) (1).png" class="brand-logo">
            <span>RoutOS</span>
        </a>

        <h1>Create your account</h1>
        <p class="lead">Free to start. Takes less than a minute.</p>

        <form action="/signup" method="POST">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>
                <button type="button" class="toggle-password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <label for="confirm">Confirm password</label>
            <div class="password-field">
                <input type="password" id="confirm" name="confirm" required>
                <button type="button" class="toggle-password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <label class="checkbox-row">
                <input type="checkbox" name="terms" required>
                <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
            </label>

            <button type="submit" class="submit-btn">Create account</button>
        </form>

        <p class="signup-link">Already have an account? <a href="/">Sign in</a></p>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
